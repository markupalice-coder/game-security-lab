apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-api-pass
spec:
  replicas: 2
  selector:
    matchLabels:
      app: game-api-pass
  template:
    metadata:
      labels:
        app: game-api-pass
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: api
          image: game-api:local
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          ports:
            - containerPort: 3000
