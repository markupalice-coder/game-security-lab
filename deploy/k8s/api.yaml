apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-api
  labels:
    app: game-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: game-api
  template:
    metadata:
      labels:
        app: game-api
    spec:
      containers:
        - name: game-api
          image: game-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: game-api
  labels:
    app: game-api
spec:
  type: ClusterIP
  selector:
    app: game-api
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP