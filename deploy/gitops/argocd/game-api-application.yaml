apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: game-api
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: game-security-lab
    security.game-lab/control: gitops
spec:
  project: default
  source:
    repoURL: https://github.com/markupalice-coder/game-security-lab
    targetRevision: main
    path: deploy/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: game
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
