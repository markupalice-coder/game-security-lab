
# Lab 49 dependency review policy.

# This file converts the Lab 48 license baseline into an automated pull request gate.



fail-on-severity: high



fail-on-scopes:

- runtime

- unknown



license-check: true

vulnerability-check: true



allow-licenses:

- MIT

- Apache-2.0

- BSD-2-Clause

- BSD-3-Clause

- ISC



comment-summary-in-pr: on-failure



show-openssf-scorecard: true

warn-on-openssf-scorecard-level: 3

