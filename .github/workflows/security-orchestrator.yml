name: security-orchestrator

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  sast:
    name: SAST reusable security scan
    uses: ./.github/workflows/security-reusable.yml
    with:
      target-path: .

  summary:
    name: Security summary
    runs-on: ubuntu-latest
    needs: [sast]
    if: ${{ always() }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write security summary
        env:
          SAST_RESULT: ${{ needs.sast.result }}
          SECRETS_RESULT: tracked-by-dedicated-workflow
          DEPENDENCIES_RESULT: tracked-by-dedicated-workflow
          CONTAINERS_RESULT: tracked-by-dedicated-workflow
          IAC_RESULT: tracked-by-dedicated-workflow
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
        run: ./scripts/write-security-summary.sh
