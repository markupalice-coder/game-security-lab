name: security-orchestrator

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-orchestrator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: security preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run orchestrator preflight
        run: bash ./scripts/security-orchestrator-preflight.sh

  reusable-security:
    name: reusable security control plane
    needs: preflight
    uses: ./.github/workflows/security-reusable.yml
    with:
      target-path: .

  final-decision:
    name: final security decision
    runs-on: ubuntu-latest
    needs:
      - preflight
      - reusable-security
    if: always()
    permissions:
      contents: read
    steps:
      - name: Fail if any orchestrated job failed
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          SECURITY_RESULT: ${{ needs.reusable-security.result }}
        run: |
          if [[ "$PREFLIGHT_RESULT" != "success" || "$SECURITY_RESULT" != "success" ]]; then
            echo "Security orchestrator failed. Check upstream job logs."
            exit 1
          fi
          echo "Security orchestrator passed."
