name: security-orchestrator

on:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  sast:
    uses: ./.github/workflows/security-reusable.yml
    with:
      target-path: .

  severity-policy:
    name: severity-policy
    runs-on: ubuntu-latest
    needs: [sast]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Validate severity policy YAML
        run: docker run --rm -v "$PWD:/work" -w /work mikefarah/yq:4 eval '.' security/severity-policy.yml > /dev/null

      - name: Write normalized severity policy summary
        if: always()
        run: ./scripts/severity-policy-summary.sh

      - name: Upload severity policy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: severity-policy-summary
          path: security/out/severity-policy-summary.md

  summary:
    name: security-summary
    runs-on: ubuntu-latest
    needs: [sast, severity-policy]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Write security summary
        run: |
          {
            echo "## Security Summary"
            echo
            echo "- SAST: ${{ needs.sast.result }}"
            echo "- Severity policy: ${{ needs.severity-policy.result }}"
            echo
            echo "Severity decisions are now normalized through security/severity-policy.yml."
            echo
            echo "Blocking tier: critical, high"
            echo "Warning tier: medium, low"
          } >> "$GITHUB_STEP_SUMMARY"
