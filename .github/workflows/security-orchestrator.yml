
name: security-orchestrator

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-orchestrator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Security preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check repository
        shell: bash
        run: |
          echo "Security preflight passed."

  sast:
    name: Static application security testing
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run SAST
        shell: bash
        run: |
          echo "SAST placeholder completed."

  severity-policy:
    name: Validate severity policy
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate severity policy
        shell: bash
        run: |
          test -f security/severity-policy.yml
          echo "Severity policy file found."

  security-summary:
    name: Publish security summary
    runs-on: ubuntu-latest
    needs:
      - sast
      - preflight
      - severity-policy
    if: always()
    steps:
      - name: Publish security summary
        shell: bash
        env:
          SAST_RESULT: ${{ needs.sast.result }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          POLICY_RESULT: ${{ needs.severity-policy.result }}
        run: |
          {
            echo "## Security Summary"
            echo "- SAST result: ${SAST_RESULT}"
            echo "- Preflight result: ${PREFLIGHT_RESULT}"
            echo "- Severity policy result: ${POLICY_RESULT}"
            echo "- Evidence bundle: uploaded by the evidence-bundle job"
          } >> "$GITHUB_STEP_SUMMARY"

  evidence-bundle:
    name: Build and upload security evidence bundle
    runs-on: ubuntu-latest
    needs:
      - preflight
      - severity-policy
    if: always()
    permissions:
      contents: read
      artifact-metadata: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build evidence bundle
        shell: bash
        run: bash scripts/evidence-bundle.sh

      - name: Upload security evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: security-evidence-${{ github.run_number }}-${{ github.sha }}
          path: security/evidence-bundle.tgz
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
          include-hidden-files: false
