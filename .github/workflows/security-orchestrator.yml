
name: security-orchestrator

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-orchestrator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: security preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run security preflight
        run: bash ./scripts/security-orchestrator-preflight.sh

  reusable-security:
    name: reusable security control plane
    uses: ./.github/workflows/security-reusable.yml
    with:
      target-path: .

  summary:
    name: Security summary
    runs-on: ubuntu-latest
    needs:
      - preflight
      - reusable-security
    if: always()
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write security summary
        env:
          SAST_RESULT: ${{ needs.reusable-security.result }}
          SECRETS_RESULT: tracked-by-dedicated-workflow
          DEPENDENCIES_RESULT: tracked-by-dedicated-workflow
          CONTAINERS_RESULT: tracked-by-dedicated-workflow
          IAC_RESULT: tracked-by-dedicated-workflow
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
        run: ./scripts/write-security-summary.sh

  final-decision:
    name: final security decision
    runs-on: ubuntu-latest
    needs:
      - preflight
      - reusable-security
    if: always()
    permissions:
      contents: read
    steps:
      - name: Fail if any orchestrated job failed
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          SECURITY_RESULT: ${{ needs.reusable-security.result }}
        run: |
          if [[ "$PREFLIGHT_RESULT" != "success" || "$SECURITY_RESULT" != "success" ]]; then
            echo "Security orchestrator failed. Check upstream job logs."
            exit 1
          fi
          echo "Security orchestrator passed."
