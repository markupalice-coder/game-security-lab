name: security-orchestrator

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast:
    name: Run reusable security scan
    uses: ./.github/workflows/security-reusable.yml
    with:
      target-path: .

  summary:
    name: Write developer security summary
    runs-on: ubuntu-latest
    needs:
      - sast
    if: always()
    permissions:
      contents: read
    steps:
      - name: Write security summary
        shell: bash
        env:
          SAST_RESULT: ${{ needs.sast.result }}
        run: |
          {
            echo "## Security Summary"
            echo "- Reusable SAST workflow result: ${SAST_RESULT}"
            echo "- Evidence bundle: see the security evidence artifact."
          } >> "$GITHUB_STEP_SUMMARY"

  evidence:
    name: Upload security evidence bundle
    runs-on: ubuntu-latest
    needs:
      - sast
      - summary
    if: always()
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build evidence bundle
        shell: bash
        run: bash ./scripts/evidence-bundle.sh

      - name: Upload security evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: security-evidence-${{ github.run_number }}-${{ github.sha }}
          path: security/evidence-bundle.tgz
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
          include-hidden-files: false