
name: security-orchestrator

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-orchestrator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Preflight validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install YAML validator
        run: python -m pip install PyYAML

      - name: Validate Kubernetes manifest
        run: |
          python - <<'PY'
          import yaml

          with open("deploy/k8s/api.yaml", encoding="utf-8") as f:
              documents = list(yaml.safe_load_all(f))

          documents = [doc for doc in documents if doc is not None]

          if not documents:
              raise SystemExit("Kubernetes manifest is empty")

          for document in documents:
              if not isinstance(document, dict):
                  raise SystemExit("Invalid Kubernetes YAML document")

          print(f"Validated {len(documents)} YAML document(s).")
          PY

  severity-policy:
    name: Severity policy and scanner rollout
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate severity policy
        run: |
          python -m pip install PyYAML
          python - <<'PY'
          import yaml

          path = "security/severity-policy.yml"

          with open(path, encoding="utf-8") as f:
              policy = yaml.safe_load(f) or {}

          if not isinstance(policy, dict):
              raise SystemExit("Severity policy must be a YAML mapping")

          rollout = policy.get("rollout", {})

          if not isinstance(rollout, dict):
              raise SystemExit("rollout must be a YAML mapping")

          mode = rollout.get("new_scanner_mode")
          if mode != "warn_only_first_two_weeks":
              raise SystemExit(
                  f"Unexpected scanner rollout mode: {mode}"
              )

          requirement = rollout.get("promotion_requires")
          if requirement != "low_false_positive_rate":
              raise SystemExit(
                  f"Unexpected promotion requirement: {requirement}"
              )

          print("Severity policy and rollout settings are valid.")
          PY

      - name: Run experimental scanner rollout gate
        env:
          SCANNER_NAME: experimental-new-scanner
        run: |
          echo "Scanner: ${SCANNER_NAME}"
          echo "Mode: warn-only during the initial rollout."
          echo "Promotion requires a low false-positive rate."

  evidence-bundle:
    name: Build security evidence bundle
    runs-on: ubuntu-latest
    needs:
      - preflight
      - severity-policy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build evidence bundle
        run: bash scripts/evidence-bundle.sh

      - name: Upload evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: lab85-security-evidence
          path: security/evidence-bundle.tgz
          if-no-files-found: error
          retention-days: 30
