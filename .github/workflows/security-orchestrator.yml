
name: security-orchestrator

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-orchestrator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Security preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate security policy
        run: |
          test -f security/severity-policy.yml
          test -f deploy/k8s/api.yaml
          echo "Required security files are present."

  reusable-security:
    name: Reusable security checks
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for conflict markers
        run: |
          if grep -nE '^(<<<<<<<|=======|>>>>>>>)' \
            .github/workflows/security-orchestrator.yml \
            deploy/k8s/api.yaml \
            security/severity-policy.yml; then
            echo "::error::Git conflict markers detected."
            exit 1
          fi
          echo "No Git conflict markers found."

      - name: Validate Kubernetes manifest
        run: |
          python - <<'PY'
          import yaml

          with open("deploy/k8s/api.yaml", encoding="utf-8") as f:
              documents = list(yaml.safe_load_all(f))

          documents = [doc for doc in documents if doc is not None]
          if not documents:
              raise SystemExit("Kubernetes manifest is empty")

          print(f"Validated {len(documents)} YAML document(s).")
          PY

      - name: Install YAML validator
        run: python -m pip install PyYAML

  severity-policy:
    name: Severity policy and scanner rollout
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate severity policy
        run: |
          python -m pip install PyYAML
          python - <<'PY'
          import yaml

          path = "security/severity-policy.yml"
          with open(path, encoding="utf-8") as f:
              policy = yaml.safe_load(f) or {}

          rollout = policy.get("rollout", {})
          if not isinstance(rollout, dict):
              raise SystemExit("rollout must be a YAML mapping")

          mode = rollout.get("new_scanner_mode")
          if mode != "warn_only_first_two_weeks":
              raise SystemExit(
                  f"Unexpected scanner rollout mode: {mode}"
              )

          requirement = rollout.get("promotion_requires")
          if requirement != "low_false_positive_rate":
              raise SystemExit(
                  f"Unexpected promotion requirement: {requirement}"
              )

          print("Severity policy and rollout settings are valid.")
          PY

      - name: Run experimental scanner rollout gate
        env:
          SCANNER_NAME: experimental-new-scanner
          SCANNER_EXIT_CODE: "1"
        run: bash scripts/scanner-rollout-gate.sh

      - name: Upload rollout report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-rollout-report
          path: security/out/experimental-new-scanner-rollout.md
          if-no-files-found: ignore

  summary:
    name: Security summary
    runs-on: ubuntu-latest
    needs: [preflight, reusable-security, severity-policy]
    if: always()
    steps:
      - name: Publish security summary
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          SECURITY_RESULT: ${{ needs.reusable-security.result }}
          POLICY_RESULT: ${{ needs.severity-policy.result }}
        run: |
          {
            echo "## Security Orchestrator Summary"
            echo
            echo "- Preflight: $PREFLIGHT_RESULT"
            echo "- Security checks: $SECURITY_RESULT"
            echo "- Severity policy: $POLICY_RESULT"
            echo
            echo "Severity decisions are normalized through security/severity-policy.yml."
            echo
            echo "Blocking tier: critical, high"
            echo "Warning tier: medium, low"
            echo
            echo "Experimental scanner rollout: warn-only."
          } >> "$GITHUB_STEP_SUMMARY"

  final-decision:
    name: final-security-decision
    runs-on: ubuntu-latest
    needs: [preflight, reusable-security, severity-policy, summary]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Fail if any orchestrated job failed
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          SECURITY_RESULT: ${{ needs.reusable-security.result }}
          POLICY_RESULT: ${{ needs.severity-policy.result }}
        run: |
          if [[ "$PREFLIGHT_RESULT" != "success" ||
                "$SECURITY_RESULT" != "success" ||
                "$POLICY_RESULT" != "success" ]]; then
            echo "Security orchestrator failed. Check upstream job logs."
            exit 1
          fi

          echo "Security orchestrator passed."
