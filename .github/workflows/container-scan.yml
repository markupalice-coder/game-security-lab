
name: container-scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  trivy-sarif:
    name: Build image, scan with Trivy, upload SARIF
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build API container image
        run: docker build -t game-api:${{ github.sha }} src/api

      - name: Run Trivy vulnerability scanner and emit SARIF
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: game-api:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          limit-severities-for-sarif: true

      - name: Upload Trivy SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container-game-api
