name: dependency-dashboard

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/api/package-lock.json

      - name: Install API dependencies
        working-directory: src/api
        run: npm ci

      - name: Generate dependency risk dashboard
        run: bash ./scripts/dependency-dashboard.sh

      - name: Add dashboard to GitHub Actions summary
        run: cat security/out/dependency-dashboard.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload dependency risk evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-risk-dashboard
          path: |
            security/out/dependency-dashboard.md
            security/out/*.log
            security/out/repo-sbom.cdx.json
          retention-days: 14
