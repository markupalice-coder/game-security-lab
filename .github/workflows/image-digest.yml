name: image-digest

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-push-capture-digest:
    name: Build, push, and capture image digest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set lowercase image owner
        id: image_owner
        shell: bash
        run: |
          OWNER_LOWER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "owner_lower=${OWNER_LOWER}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: src/api
          push: true
          tags: ghcr.io/${{ steps.image_owner.outputs.owner_lower }}/game-api:lab59-${{ github.sha }}

      - name: Write digest evidence
        shell: bash
        run: |
          mkdir -p security/out

          IMAGE_TAG="ghcr.io/${{ steps.image_owner.outputs.owner_lower }}/game-api:lab59-${{ github.sha }}"
          IMAGE_DIGEST="${{ steps.build.outputs.digest }}"

          {
            echo "IMAGE_TAG=${IMAGE_TAG}"
            echo "IMAGE_DIGEST=${IMAGE_DIGEST}"
            echo "PINNED_IMAGE=ghcr.io/${{ steps.image_owner.outputs.owner_lower }}/game-api@${IMAGE_DIGEST}"
            echo "CAPTURED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "SOURCE_COMMIT=${GITHUB_SHA}"
          } > security/out/image-digest.env

      - name: Print pinned image
        shell: bash
        run: |
          grep '^PINNED_IMAGE=' security/out/image-digest.env

      - name: Upload digest evidence
        uses: actions/upload-artifact@v4
        with:
          name: image-digest-evidence
          path: security/out/image-digest.env
          if-no-files-found: error
