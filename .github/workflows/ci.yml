
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sbom:
    name: SBOM evidence artifact
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Generate repository SBOM
        run: bash ./scripts/generate-sbom.sh

      - name: Scan SBOM with Grype
        run: bash ./scripts/scan-sbom.sh

      - name: Upload SBOM evidence artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repo-sbom-${{ github.sha }}
          path: security/out/repo-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
          include-hidden-files: false

  workflow-lint:
    name: workflow-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Run actionlint
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:latest -color

  api-test:
    name: API test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Test API safely
        run: bash ./scripts/test-api.sh
