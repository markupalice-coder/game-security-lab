
name: ci



on:

pull_request:

push:

branches: [ main ]



permissions:

contents: read



jobs:

workflow-lint:

runs-on: ubuntu-latest

permissions:

contents: read

steps:

- uses: actions/checkout@v4

- name: Run actionlint

uses: docker://rhysd/actionlint:latest



api-test:

runs-on: ubuntu-latest

permissions:

contents: read

steps:

- uses: actions/checkout@v4



- uses: actions/setup-node@v4

with:

node-version: "22"

cache: npm

cache-dependency-path: src/api/package-lock.json



- name: Test API through reviewed script

run: ./scripts/test-api.sh

