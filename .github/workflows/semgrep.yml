
name: semgrep

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    name: semgrep-community-sast
    runs-on: ubuntu-latest

    container:
      image: semgrep/semgrep:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Test custom Semgrep rules
        run: semgrep test security/semgrep

      - name: Run Semgrep Community SAST
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/secrets \
            --error \
            --exclude security/semgrep/github-actions-dangerous-run.test.yaml \
            .
