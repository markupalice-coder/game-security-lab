name: control-review

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-control-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run API tests
        run: ./scripts/test-api.sh

      - name: Generate SBOM
        run: ./scripts/generate-sbom.sh

      - name: Scan SBOM
        run: ./scripts/scan-sbom.sh || true

      - name: Run IaC scan
        run: ./scripts/checkov.sh || true

      - name: Build evidence bundle
        run: ./scripts/evidence-bundle.sh

      - name: Build control review report
        run: ./scripts/control-review.sh

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Full Security Control Review"
            echo
            echo "- API tests: executed"
            echo "- SBOM generation: executed"
            echo "- SBOM vulnerability scan: executed"
            echo "- IaC scan: executed"
            echo "- Evidence bundle: generated"
            echo "- Control review report: generated"
            echo
            echo "Review the uploaded artifact named security-control-review before making a release decision."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload security control review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-control-review
          path: |
            security/out/control-review.md
            security/evidence-bundle.tgz
          retention-days: 30
