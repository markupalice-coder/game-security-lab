
version: 1

policy_name: gaming-security-severity-policy

severity_levels:
  - critical
  - high
  - medium
  - low
  - informational
  - unknown

scanner_mappings:
  semgrep:
    ERROR: high
    WARNING: medium
    INFO: informational

  gitleaks:
    verified_secret: critical
    possible_secret: high
    allowlisted_training_secret: informational

  trivy:
    CRITICAL: critical
    HIGH: high
    MEDIUM: medium
    LOW: low
    UNKNOWN: unknown

  osv:
    critical: critical
    high: high
    medium: medium
    low: low
    unknown: unknown

  grype:
    Critical: critical
    High: high
    Medium: medium
    Low: low
    Negligible: informational
    Unknown: unknown

  checkov:
    CRITICAL: critical
    HIGH: high
    MEDIUM: medium
    LOW: low
    UNKNOWN: unknown

severity_mapping:
  CRITICAL: critical
  HIGH: high
  MEDIUM: medium
  LOW: low
  UNKNOWN: unknown

domain_rules:
  secrets:
    rule: "block_all_verified"
    reason: "A verified credential can expose cloud accounts, signing keys, build systems, or player data."

  dependencies:
    rule: "block_high_with_fix"
    reason: "Dependency gates should prioritize severe findings that have a safe upgrade path."

  iac:
    rule: "block_high_external_exposure"
    reason: "High-severity infrastructure findings with external exposure must block release."

  containers:
    rule: "block_critical"
    reason: "Critical container vulnerabilities must block release."

  sast:
    rule: "block_high"
    reason: "High-severity static analysis findings must block release."

vulnerability_sla:
  policy_file: security/vulnerability-sla.yml
  critical:
    remediation_due: 24h
    release_gate: block
  high:
    remediation_due: 7d
    release_gate: block_if_fix_available
  medium:
    remediation_due: 30d
    release_gate: warn
  low:
    remediation_due: 90d
    release_gate: track
