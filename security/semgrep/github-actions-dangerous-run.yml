
rules:
  - id: github-actions-untrusted-context-in-run
    message: >-
      Avoid placing GitHub event context directly inside run commands.
      Move untrusted values into env variables and quote them in the shell.

    severity: WARNING
    languages:
      - yaml

    patterns:
      - pattern-inside: 'steps: [...]'
      - pattern: 'run: $SHELL'
      - metavariable-pattern:
          metavariable: $SHELL
          language: generic
          patterns:
            - pattern-either:
                - pattern: '${{ ... github.event.pull_request.title ... }}'
                - pattern: '${{ ... github.event.issue.title ... }}'

    metadata:
      category: security
      technology:
        - github-actions
        - semgrep
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      subcategory:
        - audit
      references:
        - https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions
